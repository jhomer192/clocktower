<!doctype html>
<html lang="en" data-theme="tokyo-night">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/clocktower/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <link rel="canonical" href="https://jackhomer.com/clocktower/" />
    <meta name="description" content="Storyteller assistant for Blood on the Clocktower. Walks the night order and tracks player roles, statuses, nominations, and votes." />
    <title>Clocktower ST</title>
    <script>
      // FOUC prevention: apply saved theme before first paint
      (function() {
        var t = localStorage.getItem('clocktower-theme') || 'tokyo-night';
        document.documentElement.setAttribute('data-theme', t);
      })();
    </script>
    <!-- Analytics: same property as jackhomer.com, so a visit here is attributable
         to the post or page that sent it. Cookieless; the website ID is public. -->
    <script defer src="https://cloud.umami.is/script.js" data-website-id="9a521c26-dce4-4cf0-b5d9-5266913dc11c"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
